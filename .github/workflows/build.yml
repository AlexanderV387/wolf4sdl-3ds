name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wolf3d
            flags: -DCARMACIZED -DGOODTIMES
          - variant: wolf3d-shareware
            flags: -DCARMACIZED -DUPLOAD
          - variant: sod
            flags: -DCARMACIZED -DSPEAR -DGOODTIMES
            icon: assets/icon-sod.png
          - variant: sod-demo
            flags: -DCARMACIZED -DSPEAR -DSPEARDEMO
            icon: assets/icon-sod.png
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL 1.2 portlibs
        run: |
          # The image already ships most portlibs; a failed sync is not fatal.
          dkp-pacman -Sy || (sleep 10 && dkp-pacman -Sy) || true
          echo "Available 3DS packages:"; dkp-pacman -Slq | grep '^3ds-' | tr '\n' ' '; echo
          for p in 3ds-sdl 3ds-sdl_mixer 3ds-sdl_ttf 3ds-sdl_image 3ds-sdl_gfx \
                   3ds-libvorbisidec 3ds-libmad 3ds-libogg \
                   3ds-freetype 3ds-libpng 3ds-libjpeg-turbo 3ds-zlib; do
            dkp-pacman -S --noconfirm --needed "$p" || echo "::warning::package not found: $p"
          done

      - name: Build
        run: |
          make TARGET=wolf4sdl-${{ matrix.variant }} BUILD=build-${{ matrix.variant }} \
               ICON=${{ matrix.icon || 'icon.png' }} \
               EXTRA_CFLAGS="-DVERSIONALREADYCHOSEN ${{ matrix.flags }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wolf4sdl-${{ matrix.variant }}
          path: wolf4sdl-${{ matrix.variant }}.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: elf-${{ matrix.variant }}
          path: wolf4sdl-${{ matrix.variant }}.elf

  all:
    # The four games in one program with a game picker (launcher/).
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL 1.2 portlibs
        run: |
          dkp-pacman -Sy || (sleep 10 && dkp-pacman -Sy) || true
          for p in 3ds-sdl 3ds-sdl_mixer 3ds-sdl_ttf 3ds-sdl_image 3ds-sdl_gfx \
                   3ds-libvorbisidec 3ds-libmad 3ds-libogg \
                   3ds-freetype 3ds-libpng 3ds-libjpeg-turbo 3ds-zlib; do
            dkp-pacman -S --noconfirm --needed "$p" || echo "::warning::package not found: $p"
          done

      - name: Build the four games
        run: |
          b() { make -j"$(nproc)" TARGET=wolf4sdl-$1 BUILD=build-$1 EXTRA_CFLAGS="-DVERSIONALREADYCHOSEN $2"; }
          b wolf3d "-DCARMACIZED -DGOODTIMES"
          b wolf3d-shareware "-DCARMACIZED -DUPLOAD"
          b sod "-DCARMACIZED -DSPEAR -DGOODTIMES"
          b sod-demo "-DCARMACIZED -DSPEAR -DSPEARDEMO"

      - name: Link them with the game picker
        run: |
          tools/3ds/build-combined.sh
          mv wolf4sdl.3dsx wolf4sdl-all.3dsx
          mv wolf4sdl.elf wolf4sdl-all.elf

      - uses: actions/upload-artifact@v4
        with:
          name: wolf4sdl-all
          path: wolf4sdl-all.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: elf-all
          path: wolf4sdl-all.elf

  cia:
    needs: [build, all]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: all
            title: Wolf4SDL 3DS
            desc: Wolfenstein 3D and Spear of Destiny
            id: "0xF3D50"
            code: CTR-H-W4SD
            icon: assets/icon-all.png
          - variant: wolf3d
            title: Wolf4SDL 3DS
            desc: Wolfenstein 3D (v1.4 Activision/Steam/GOG)
            id: "0xF3D51"
            code: CTR-H-W3DS
          - variant: wolf3d-shareware
            title: Wolf4SDL 3DS Shareware
            desc: Wolfenstein 3D shareware (episode 1)
            id: "0xF3D52"
            code: CTR-H-W3SW
          - variant: sod
            title: Wolf4SDL 3DS SoD
            desc: Spear of Destiny
            id: "0xF3D53"
            code: CTR-H-SODF
            icon: assets/icon-sod.png
          - variant: sod-demo
            title: Wolf4SDL 3DS SoD Demo
            desc: Spear of Destiny demo
            id: "0xF3D54"
            code: CTR-H-SODD
            icon: assets/icon-sod.png
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: elf-${{ matrix.variant }}

      - name: Install makerom and bannertool
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/3ds/install-tools.sh

      - name: Make CIA
        run: |
          tools/3ds/make-cia.sh wolf4sdl-${{ matrix.variant }}.elf wolf4sdl-${{ matrix.variant }}.cia \
            "${{ matrix.title }}" "${{ matrix.desc }}" "AlexanderV387, hax0kartik, Wolf4SDL" \
            ${{ matrix.id }} ${{ matrix.code }} \
            ${{ matrix.icon || 'assets/icon.png' }} assets/banner-${{ matrix.variant }}.png assets/banner.wav

      - uses: actions/upload-artifact@v4
        with:
          name: wolf4sdl-${{ matrix.variant }}-cia
          path: wolf4sdl-${{ matrix.variant }}.cia

  release:
    # A commit on n3ds whose message contains [release] publishes a GitHub
    # release tagged v<VERSION> with wolf4sdl-all, which plays every game
    # (GitHub creates the tag). The single-game builds stay in the run's
    # artifacts.
    if: github.ref == 'refs/heads/n3ds' && contains(github.event.head_commit.message, '[release]')
    needs: [build, all, cia]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: wolf4sdl-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Wolf4SDL-3DS ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/wolf4sdl-all.cia
            dist/wolf4sdl-all.3dsx
